name: Bug Report
description: Report a bug in the 40-cell CLI HUD, Flight Check router, or Edward Tufte Webview
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting an issue with `attention-horizon-antigravity` (`ctxtop`)!
  - type: input
    id: os_env
    attributes:
      label: Operating System & Node.js Version
      description: Output of `node -v` and your OS (Windows 11, macOS, Linux)
      placeholder: "Windows 11 / Node v22.5.0"
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to Reproduce
      description: Exact command or prompt that triggered the issue
      placeholder: |
        1. Run `npx attention-horizon-antigravity --demo`
        2. Observe...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected vs Actual Behavior
    validations:
      required: true
