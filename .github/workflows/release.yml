name: Release Pipeline (Manual Only)

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag or branch to release (e.g. main or v4.1.1)'
        required: true
        default: 'main'
      publish_npm:
        description: 'Publish packages (ctxtop & @ctxtop/mcp) to npm registry'
        required: false
        type: boolean
        default: true

jobs:
  build-and-release:
    name: Build & Publish GitHub Release (Draft)
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag_name }}

      - name: Setup Node.js 22.14.0
        uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      - name: Install Dev Dependencies (jsdom)
        run: npm ci

      - name: Verify Mirror SHA-256 Parity
        run: node scripts/sync_mirrors.mjs --verify-only

      - name: Run Full Test Suite
        run: |
          npm test
          npm run test:phases
          npm run test:e2e

      - name: Build Production Release Bundles (.zip, .tar.gz, .tgz, SHA256SUMS)
        run: npm run build:release

      - name: Create GitHub Release (Draft Only)
        if: ${{ inputs.tag_name != 'main' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag_name }}
          files: |
            dist/*.zip
            dist/*.tar.gz
            dist/*.tgz
            dist/SHA256SUMS.txt
          generate_release_notes: true
          draft: true
          prerelease: false

      - name: Publish Packages to npm (with OIDC Provenance)
        if: ${{ inputs.publish_npm }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          npm publish --provenance --access public || echo "Root package publish skipped or already exists on npm"
          npm publish ./packages/mcp --provenance --access public
