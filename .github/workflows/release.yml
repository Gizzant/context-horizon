name: Release Pipeline (Manual Only)

# Manual release. Requires an existing git tag `v<version>` that matches package.json.
# Recommended: add required reviewers to a protected `release` environment and
# set `environment: release` on the job so publishing needs a human approval.

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Existing release tag (e.g. v4.1.1). Branch names are refused.'
        required: true
        type: string
      publish_npm:
        description: 'Publish packages (ctxtop & @ctxtop/mcp) to npm registry'
        required: false
        type: boolean
        default: false

permissions: {}

concurrency:
  group: release-${{ inputs.tag_name }}
  cancel-in-progress: false

jobs:
  build-and-release:
    name: Build & Publish GitHub Release (Draft)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Validate tag input
        env:
          TAG: ${{ inputs.tag_name }}
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::tag_name must look like v4.1.1 (got: $TAG). Branches are not releasable."
            exit 1
          fi

      - name: Checkout repository (tag only)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: refs/tags/${{ inputs.tag_name }}
          persist-credentials: false

      - name: Setup Node.js 22.14.0
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.14.0'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      - name: Verify tag matches package versions
        env:
          TAG: ${{ inputs.tag_name }}
        run: |
          ROOT=$(node -p "require('./package.json').version")
          MCP=$(node -p "require('./packages/mcp/package.json').version")
          if [ "v$ROOT" != "$TAG" ] || [ "v$MCP" != "$TAG" ]; then
            echo "::error::Tag $TAG does not match package.json ($ROOT) / packages/mcp ($MCP)"
            exit 1
          fi

      - name: Install Dev Dependencies (jsdom)
        run: npm ci

      - name: Verify Mirror SHA-256 Parity
        run: node scripts/sync_mirrors.mjs --verify-only

      - name: Verify CHECKSUMS.sha256 is current
        run: |
          node scripts/generate_checksums.mjs
          git diff --exit-code CHECKSUMS.sha256

      - name: Run Full Test Suite
        run: |
          npm test
          npm run test:phases
          npm run test:e2e

      - name: Build Production Release Bundles (.zip, .tar.gz, .tgz, SHA256SUMS)
        run: npm run build:release

      - name: Create GitHub Release (Draft Only)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag_name }}
        run: |
          gh release create "$TAG" \
            dist/*.zip dist/*.tar.gz dist/*.tgz dist/SHA256SUMS.txt \
            --draft --generate-notes --verify-tag --title "$TAG"

      - name: Publish Packages to npm (with OIDC Provenance)
        if: ${{ inputs.publish_npm }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          publish_if_new() {
            dir="$1"
            name=$(node -p "require('./$dir/package.json').name")
            ver=$(node -p "require('./$dir/package.json').version")
            if npm view "$name@$ver" version >/dev/null 2>&1; then
              echo "$name@$ver already on npm; skipping"
            else
              (cd "$dir" && npm publish --provenance --access public)
            fi
          }
          publish_if_new .
          publish_if_new packages/mcp
