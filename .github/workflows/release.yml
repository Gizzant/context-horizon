name: Release Pipeline (Manual Only)

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag to release (e.g. v3.4.0)'
        required: true
        default: 'v3.4.0'

jobs:
  build-and-release:
    name: Build & Publish GitHub Release (Draft)
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run Full Test Suite
        run: |
          npm test
          npm run test:phases
          npm run test:e2e

      - name: Build Production Release Bundles (.zip, .tar.gz, .tgz, SHA256SUMS)
        run: npm run build:release

      - name: Create GitHub Release (Draft Only)
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
            dist/*.tar.gz
            dist/*.tgz
            dist/SHA256SUMS.txt
          generate_release_notes: true
          draft: true
          prerelease: false
