name: CI Matrix (Windows, macOS, Linux)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: ['22.14.0']

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js ${{ matrix.node }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'

      - name: Install Dev Dependencies (jsdom)
        run: npm ci

      - name: Verify Mirror SHA-256 Parity
        run: node scripts/sync_mirrors.mjs --verify-only

      - name: Run Core Router, Sensor & Wedge Suites
        run: npm run test:unit

      - name: Run Active Coach, Ring-1 Security & Regression Suites
        run: node -e "const { spawnSync } = require('node:child_process'); const r = spawnSync(process.execPath, ['--test', 'test/all.test.mjs'], { encoding: 'utf8', maxBuffer: 64 * 1024 * 1024 }); process.stdout.write(r.stdout || ''); process.stderr.write(r.stderr || ''); if (r.status !== 0) { const lines = ((r.stdout || '') + '\n' + (r.stderr || '')).split(/\r?\n/); const fails = lines.filter((l, i) => /^not ok\b|AssertionError|ERR_|Error:/i.test(l.trim())).slice(0, 15).join(' | '); console.log('::error title=Coach Suite Failure::' + (fails || 'Exited with ' + r.status)); process.exit(r.status || 1); }"

      - name: Run Gate 0-6 Architectural Verification Suites
        run: npm run test:gates

      - name: Run 7-Phase Architectural Verification Suite
        run: npm run test:phases

      - name: Run E2E Context Memory Verification
        run: npm run test:e2e

      - name: Run 200-Iteration Latency Benchmark
        run: npm run bench

      - name: Smoke Test CLI (--demo, --roast, init --dry-run, doctor)
        run: |
          node src/cli/init.mjs --demo
          node src/cli/init.mjs --roast
          node src/cli/init.mjs init --dry-run
          node src/cli/init.mjs doctor
