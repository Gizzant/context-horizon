name: CI Matrix (Windows, macOS, Linux)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: ['22.14.0', '24.11.0']
        # One macOS job (minimum supported Node) to limit exposure to macOS runner capacity queues
        exclude:
          - os: macos-latest
            node: '24.11.0'

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js ${{ matrix.node }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'

      - name: Install Dev Dependencies (jsdom)
        run: npm ci

      - name: Sync Mirrors
        run: node scripts/sync_mirrors.mjs

      - name: Verify Mirror SHA-256 Parity
        run: node scripts/sync_mirrors.mjs --verify-only

      - name: Run Core Router, Sensor & Wedge Suites
        run: npm run test:unit

      - name: Run Active Coach, Ring-1 Security & Regression Suites
        run: |
          node -e "const fs = require('node:fs'), { spawnSync } = require('node:child_process'); const r = spawnSync(process.execPath, ['--import', './test/setup/isolate-home.mjs', '--test', 'test/all.test.mjs'], { encoding: 'utf8', maxBuffer: 64 * 1024 * 1024 }); if (r.status !== 0) { const lines = ((r.stdout || '') + '\n' + (r.stderr || '')).split(/\r?\n/); const fails = lines.filter((l) => /^not ok\b|AssertionError|ERR_|Error:/i.test(l.trim()) && !/ok 42/.test(l)).slice(0, 15).join(' | '); fs.writeSync(1, '::error title=Coach Suite Failure::' + (fails || 'Exited with ' + r.status) + '\n'); process.exit(r.status || 1); } fs.writeSync(1, 'Coach Suite Passed (' + (r.stdout || '').split('\n').length + ' lines)\n');"

      - name: Run Claude Code Integration Suites
        run: npm run test:claude

      - name: Run Gate 0-6 Architectural Verification Suites
        run: npm run test:gates

      - name: Run 7-Phase Architectural Verification Suite
        run: npm run test:phases

      - name: Run E2E Context Memory Verification
        run: npm run test:e2e

      - name: Run 200-Iteration Latency Benchmark
        run: npm run bench

      - name: Smoke Test CLI (--demo, --roast, init --dry-run, doctor)
        run: |
          node src/cli/init.mjs --demo
          node src/cli/init.mjs --roast
          node src/cli/init.mjs init --dry-run
          node src/cli/init.mjs doctor

  node20-fallback:
    name: Node 20.19.0 LTS (JSONL Fallback) on ubuntu-latest
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js 20.19.0
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20.19.0'
          cache: 'npm'

      - name: Install Dev Dependencies (jsdom)
        run: npm ci

      - name: Verify Mirror SHA-256 Parity & Release Checksums
        run: |
          node scripts/sync_mirrors.mjs --verify-only
          node bin/ctxtop.mjs verify --json

      - name: Run Node 20 LTS Compatibility & Fallback Suites
        run: node --import ./test/setup/isolate-home.mjs --test test/node20_antigravity_compat.test.mjs test/engine_node_db_probe.test.mjs test/pro_team_anchors.test.mjs test/vscode_extension.test.mjs

      - name: Run Unit & Claude Code Suites on Node 20 LTS
        run: |
          npm run test:unit
          npm run test:claude

      - name: Smoke Test CLI on Node 20 LTS
        run: |
          node bin/ctxtop.mjs doctor
          node bin/ctxtop.mjs audit --days 7
          node bin/ah-statusline.mjs --demo --cols 110
          node src/cli/init.mjs --demo
