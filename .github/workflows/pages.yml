name: Docs site (GitHub Pages)

on:
  push:
    branches: [main]
    paths: ['docs-site/**', 'docs/index.html', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Stage public site and interactive demo
        run: |
          rm -rf _site
          cp -R docs-site _site
          rm -f _site/_audit-inventory.json
          mkdir -p _site/demo
          cp docs/index.html _site/demo/index.html

      - name: Upload docs-site and demo
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
