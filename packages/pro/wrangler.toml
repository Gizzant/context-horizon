name = "ctxtop-polar-webhook"
main = "workers/polar_webhook_worker.mjs"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

[vars]
CTXTOP_LTD_MAX_CAP = "200"
CTXTOP_EMAIL_FROM = "Highbeam <licenses@highbeamdev.com>"
# Enforce the 200-seat LTD limit in Polar.sh product stock settings; by default the webhook honors
# already-paid order.paid events (set "true" only if you strictly want HTTP 409 rejections).
# CTXTOP_ENFORCE_HARD_409_CAP = "false"
# Map Polar product_id values directly to SKUs so coupons/discounts never alter license tiers:
# CTXTOP_POLAR_PRODUCT_MAP = '{"prod_monthly_id":"pro_monthly","prod_annual_id":"pro_annual","prod_ltd_id":"pro_ltd","prod_team_id":"team_starter"}'

# Required before deploy: create the namespace and paste its id here.
#   npx wrangler kv namespace create LICENSE_KV
# Holds processed order ids (retry dedupe) and the real LTD sold counter.
[[kv_namespaces]]
binding = "LICENSE_KV"
id = "d328648882fb45e5b2f2dc7895d4dc6a"

# Also required (secrets, never in this file):
#   npx wrangler secret put RESEND_API_KEY
#   npx wrangler secret put CTXTOP_POLAR_WEBHOOK_SECRET
#   npx wrangler secret put CTXTOP_ED25519_PRIVATE_KEY_PEM
# CTXTOP_EMAIL_FROM above must stay a Resend-verified sender on highbeamdev.com.
